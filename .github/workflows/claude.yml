# Claude Code GitHub Action: mention @claude in an issue or pull request comment to have Claude
# answer, review or make changes. Needs the Claude GitHub App (https://github.com/apps/claude)
# installed on this repository and one of these repository secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  (Claude subscription; create it with `claude setup-token`), or
#   ANTHROPIC_API_KEY        (Claude API key; then swap the two lines marked below)
# Only users with write access to the repository can trigger it.
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # subscription token
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}             # or an API key instead
