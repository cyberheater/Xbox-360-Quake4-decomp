# Builds Quake4-Setup-<version>.exe (the installer: this repository's source plus setup.ps1, no
# game files or game code) on a GitHub Windows runner and attaches it to the GitHub release
# v<version>, creating the release if it does not exist yet.
#
# To publish: change installer/VERSION (and optionally installer/RELEASE_NOTES.md) and push to main.
# An existing release keeps its notes; its installer file is replaced.
name: Release installer
on:
  push:
    branches: [main]
    paths: ['installer/VERSION']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Get-Content installer/VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "installer/VERSION must look like 1.2.3 (got '$version')" }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          powershell -NoProfile -ExecutionPolicy Bypass -File installer/build_installer.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { throw 'installer build failed' }
          Get-FileHash "installer/out/Quake4-Setup-$version.exe" -Algorithm SHA256 | Format-List
      - name: Publish to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $exe = "installer/out/Quake4-Setup-$env:VERSION.exe"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            $notes = 'installer/RELEASE_NOTES.md'
            if (Test-Path $notes) {
              gh release create $tag $exe --target $env:GITHUB_SHA --title "$tag" --notes-file $notes
            } else {
              gh release create $tag $exe --target $env:GITHUB_SHA --title "$tag" --generate-notes
            }
          }
          if ($LASTEXITCODE -ne 0) { throw 'publishing failed' }
